name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc

    - name: Build Release
      run: cargo build --release --workspace --verbose

    - name: Package for Release
      run: |
        cd target/release
        powershell Compress-Archive -Path darkcore-manager.exe -DestinationPath darkcore-manager-x86_64-pc-windows-msvc.zip

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: target/release/darkcore-manager-x86_64-pc-windows-msvc.zip
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

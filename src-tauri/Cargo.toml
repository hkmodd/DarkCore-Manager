[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.10"
glob = "0.3"
chrono = "0.4"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }
flate2 = "1.0"
zip = "0.6"
self_update = { version = "0.39", features = ["archive-zip", "compression-zip-deflate"] }
walkdir = "2.4"
open = "5.0"
directories = "5.0"
rfd = "0.12"
lazy_static = "1.4"
bytes = "1.5"
sysinfo = "0.30"
futures = "0.3"
ico = "0.3"
aes = "0.8"
cbc = "0.1"
adler32 = "1.2"
lzma-rs = "0.3"
zstd = "0.13"
sha1 = "0.10"
protobuf = "3.2"
libloading = "0.9.0"

steam-vent = { git = "https://github.com/icewind1991/steam-vent" }
steam-vent-proto = { git = "https://github.com/icewind1991/steam-vent" }
tauri-plugin-dialog = "2.6.0"
winreg = "0.55.0"

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[package]
name = "darkcore-manager"
version = "1.7.0"
edition = "2021"

[dependencies]
self_update = { version = "0.39", features = ["archive-zip", "compression-zip-deflate"] }
eframe = "0.29.1"
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "sync", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
regex = "1.10"
walkdir = "2.4"
open = "5.0"
directories = "5.0"
rfd = "0.12"
hex = "0.4"
lazy_static = "1.4"
glob = "0.3"
bytes = "1.5"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.24", features = ["jpeg", "png"] }
rodio = "0.17"
sysinfo = "0.30"
chrono = "0.4"
futures = "0.3"
ico = "0.3"
steam-vent = { git = "https://github.com/icewind1991/steam-vent" }
steam-vent-proto = { git = "https://github.com/icewind1991/steam-vent" }
aes = "0.8"
cbc = "0.1"
adler32 = "1.2"
flate2 = "1.0"
lzma-rs = "0.3"
zstd = "0.13"
sha1 = "0.10"
protobuf = "3.2"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemServices",
] }
libloading = "0.9.0"

[build-dependencies]
winres = "0.1"

